name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev \
            liblzma-dev libbz2-dev libreadline-dev libsqlite3-dev libgdbm-dev \
            libgdbm-compat-dev tk-dev uuid-dev libexpat1-dev libdb-dev

      - name: Check Java version
        run: java -version

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.19

      - name: Build APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
